name: Auto Publish Drive Videos to YouTube

on:
  schedule:
    - cron: '0 */4 * * *' # প্রতি ৪ ঘণ্টা পরপর অটোমেটিক চলবে (দিনে ৬ বার)
  workflow_dispatch:       # ম্যানুয়ালি টেস্ট করার জন্য Run বাটন চালু রাখবে

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run video uploader
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python upload.py

      - name: Save uploaded video history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uploaded_videos.json
          git diff --staged --quiet || (git commit -m "Update uploaded videos log" && git push)
